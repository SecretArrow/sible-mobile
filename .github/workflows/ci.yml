name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.27.4"

jobs:
  analyze:
    name: Lint & Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze --no-fatal-infos

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run unit tests
        run: flutter test --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7

  build:
    name: Build Release APK
    needs: [analyze, test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: flutter pub get
      - name: Setup signing keystore (from GitHub Secrets)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PW: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/release-key.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release-key.jks\n' \
            "$STORE_PW" "$KEY_PW" "$KEY_ALIAS" > android/key.properties
      - name: Build APKs (release, signed, split-per-abi)
        run: flutter build apk --release --split-per-abi
      - name: Verify APK signatures
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            echo "== Verifying $(basename "$apk") =="
            "$APKSIGNER" verify "$apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: sible-miner-release-apk
          path: build/app/outputs/flutter-apk/*-release.apk
          retention-days: 14

  release:
    name: Auto-release Signed APK
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'SecretArrow/sible-mobile'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read app version
        id: ver
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: sible-miner-release-apk
          path: dist
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}+build.${{ github.run_number }}
          name: Sible Mobile v${{ steps.ver.outputs.version }} (build ${{ github.run_number }})
          body: |
            📦 **Signed release APKs (split-per-ABI)** — build otomatis #${{ github.run_number }} dari commit ${{ github.sha }}.

            - Application ID: `com.secretarrow.sible_mobile`
            - Version: `${{ steps.ver.outputs.version }}` (pubspec.yaml)
            - Signing: alias `sible-release` via GitHub Secrets
            - Build log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            **Pilih APK sesuai perangkat:**
            - `app-arm64-v8a-release.apk` → HP modern (direkomendasikan)
            - `app-armeabi-v7a-release.apk` → HP lama (32-bit)
            - `app-x86_64-release.apk` → emulator / Chromebook

            APK tertanda tangan kunci release resmi — update berikutnya dapat dipasang sebagai upgrade (versi harus lebih tinggi).
          files: dist/*-release.apk
          generate_release_notes: true

  autofix:
    name: Auto-fix (dart fix + format)
    needs: [analyze, test]
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Apply automatic fixes
        run: |
          dart fix --apply
          dart format .
      - name: Commit & push fixes
        run: |
          git config user.name "sible-autofix[bot]"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet; then
            echo "No automatic fixes available"
          else
            git add -A
            git commit -m "chore(auto-fix): apply dart fix + format [skip ci]"
            git push
          fi
