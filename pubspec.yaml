name: sible_mobile
description: "Sible Miner - multi-account Sible Network automation client with proxy engine, background worker and notifications."
publish_to: "none"
version: 2.1.0+21

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  flutter_secure_storage: ^9.2.2
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^17.2.3
  permission_handler: ^11.3.1
  uuid: ^4.5.1
  fl_chart: ^0.69.2
  local_auth: ^2.3.0
  package_info_plus: ^8.1.0
  url_launcher: ^6.3.1
  file_picker: ^8.1.6
  share_plus: ^10.1.2
  intl: ^0.19.0
  encrypt: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
